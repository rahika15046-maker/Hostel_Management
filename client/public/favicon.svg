<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Isometric building / H letter mark -->
  <!-- Left face -->
  <polygon points="7,14 16,9 16,23 7,18" fill="rgba(255,255,255,0.25)"/>
  <!-- Right face -->
  <polygon points="16,9 25,14 25,18 16,23" fill="rgba(255,255,255,0.15)"/>
  <!-- Top face -->
  <polygon points="7,14 16,9 25,14 16,19" fill="rgba(255,255,255,0.9)"/>
  <!-- Centre dot / door -->
  <circle cx="16" cy="21" r="2" fill="rgba(255,255,255,0.8)"/>
</svg>
