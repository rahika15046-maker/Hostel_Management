services:
  - type: web
    name: hostelx-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard — do NOT commit real values:
      # - key: MONGODB_URI
      #   value: <your MongoDB Atlas connection string>
      # - key: JWT_SECRET
      #   value: <a long random secret>
      # - key: CLIENT_URL
      #   value: <your Vercel frontend URL, e.g. https://your-app.vercel.app>
